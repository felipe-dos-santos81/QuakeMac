[build-system]
requires = ["setuptools>=61"]

[project]
name = "quakemcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.29.0", "Pillow>=12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["QuakeMCP/tests/unit", "QuakeMCP/tests/contract"]
