// Mouse-only control for the Apple Silicon glquake port.
//
// INSTALL: copy this file to game/id1/autoexec.cfg — the engine execs
// it automatically at startup. game/ is gitignored, so it is not
// committed. Full design: docs/superpowers/specs/
// 2026-08-30-mouse-only-control-design.md
//
// Default map (axes + left/right buttons only; no wheel or side
// buttons — consequence: no mouse-driven weapon switching):
//   MOUSE1 fire; double-click MOUSE1 = jump
//   MOUSE2 mode toggle (engine-consumed via access_toggle_button;
//                       do NOT bind it)
// The boxed LOOK/WALK label in the HUD is also clickable — the
// fallback for devices whose right button does not work.
// Look mode = mouselook. Walk mode = Y moves forward/backward,
// X sidesteps, and the view levels to the horizon on entry.
// During demo playback, any click opens the main menu.

access_mouseonly 1

// buttons
bind MOUSE1 +attack
access_toggle_button 201

// movement: throttle profile for mice and trackballs
access_move_profile 0
access_throttle_gain 0.002
access_velocity_gain 1
access_deadzone 0
access_curve 1
access_walkspeed 190
access_tremor 0
access_throttle_decay 0
sensitivity 3

// supporting settings (also tunable in Options > Mouse-only options)
sv_aim 0.93
cl_bob 0
cl_rollangle 0
v_kicktime 0
host_timescale 1
host_maxfps 72
cl_forwardspeed 400
cl_backspeed 400
skill 0

// feedback
access_hud 1
access_sounds 1
access_log 1

// gestures: left double-click jumps. "+jump; wait; -jump" is the
// vanilla one-frame jump idiom (see Cmd_Wait_f in common/cmd.c).
access_doubleclick_button 200
access_doubleclick_command "+jump; wait; -jump"

// unused by this scheme, explicitly off
access_longpress_button 0
